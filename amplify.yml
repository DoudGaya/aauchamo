version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm i -g pnpm@9
        - pnpm config set store-dir .pnpm-store
        - pnpm config set ignore-scripts false
        - pnpm install --frozen-lockfile
        - pnpm run db:generate
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .pnpm-store/**/*
      - node_modules/**/*
